[versions]
kotlin = "2.4.0"
compose-plugin = "1.11.1"
eclipse-angus = "2.0.3"
jakarta-mail = "2.1.3"
google-oauth-client = "1.34.1"
google-api-client = "2.2.0"
jsoup = "1.18.1"
dorkbox = "4.4"
slf4j = "2.0.13"
jcefmaven = "146.0.10"

[libraries]
eclipse-angus = { module = "org.eclipse.angus:jakarta.mail", version.ref = "eclipse-angus"}
jakarta-mail = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakarta-mail"}
google-oauth-client = { module = "com.google.oauth-client:google-oauth-client-jetty", version.ref = "google-oauth-client" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "google-api-client" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
dorkbox = { module = "com.dorkbox:SystemTray", version.ref = "dorkbox" }
slf4j = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j"}
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }